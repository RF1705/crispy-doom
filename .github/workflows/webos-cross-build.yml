name: webOS ARM cross-build (experimental)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/webos-cross-build.yml'
      - 'webos/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/webos-cross-build.yml'
      - 'webos/**'

permissions:
  contents: read

jobs:
  cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SDK_TAG: webos-a38c582
      SDK_DIR: ${{ github.workspace }}/.toolchains
      SDL_REF: 263629dab0c89e75f9872eed66e197174952ce02
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool pkg-config make cmake ninja-build \
            git python3 curl file binutils gettext gawk \
            libwayland-bin libglib2.0-dev imagemagick
      - name: Obtain pinned native webOS SDK (same source as starterless)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$SDK_DIR"
          gh release download "$SDK_TAG" --repo openlgtv/buildroot-nc4 \
            --pattern 'arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz' \
            --dir "$RUNNER_TEMP" --clobber
          tar -xzf "$RUNNER_TEMP/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz" -C "$SDK_DIR"
          sdk="$SDK_DIR/arm-webos-linux-gnueabi_sdk-buildroot"
          "$sdk/relocate-sdk.sh"
          test -x "$sdk/bin/arm-webos-linux-gnueabi-gcc"
          echo "WEBOS_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

      - name: Diagnose native SDK dependencies
        run: |
          set -euo pipefail
          sdk="$WEBOS_SDK_ROOT"
          sysroot="$sdk/arm-webos-linux-gnueabi/sysroot"
          echo "$sdk/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_SYSROOT_DIR=$sysroot" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$sysroot/usr/lib/pkgconfig:$sysroot/usr/share/pkgconfig" >> "$GITHUB_ENV"
          "$sdk/bin/arm-webos-linux-gnueabi-gcc" -v
          find "$sysroot" -iname '*SDL*' | head -40 || true

      - name: Prepare legacy Wayland scanner for TV SDK ABI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legacy-wayland"
          docker run --rm --platform linux/amd64 \
            -v "$RUNNER_TEMP/legacy-wayland:/out" ubuntu:20.04 bash -ec '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libwayland-bin
              cp /usr/bin/wayland-scanner /out/wayland-scanner
            '
          chmod +x "$RUNNER_TEMP/legacy-wayland/wayland-scanner"
          "$RUNNER_TEMP/legacy-wayland/wayland-scanner" --version

      - name: Build upstream SDL-webOS (same pinned source as starterless)
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/webosbrew/SDL-webOS.git "$RUNNER_TEMP/SDL-webOS"
          git -C "$RUNNER_TEMP/SDL-webOS" checkout --detach "$SDL_REF"
          # The SDK toolchain handles target compilation, not the host compiler.
          /usr/bin/cmake --version
          /usr/bin/cmake -S "$RUNNER_TEMP/SDL-webOS" -B "$RUNNER_TEMP/sdl-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$WEBOS_SDK_ROOT/share/buildroot/toolchainfile.cmake" \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl-install" \
            -DCMAKE_BUILD_TYPE=Release \
            -DWEBOS=ON -DSDL_WEBOS_BROKEN_ABI=ON \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST=OFF -DSDL_TESTS=OFF \
            -DWAYLAND_SCANNER="$RUNNER_TEMP/legacy-wayland/wayland-scanner" -DGAWK=/usr/bin/gawk
          /usr/bin/cmake --build "$RUNNER_TEMP/sdl-build" --parallel 4
          /usr/bin/cmake --install "$RUNNER_TEMP/sdl-build"
          test -f "$RUNNER_TEMP/sdl-install/lib/libSDL2.a"

      - name: Cross-compile Crispy Doom
        run: |
          set -euo pipefail
          export PATH="$WEBOS_SDK_ROOT/bin:$PATH"
          export PKG_CONFIG_PATH="$RUNNER_TEMP/sdl-install/lib/pkgconfig"
          export SDL_CFLAGS="-I$RUNNER_TEMP/sdl-install/include/SDL2"
          export SDL_LIBS="$RUNNER_TEMP/sdl-install/lib/libSDL2.a"
          make -C webos preflight
          bash webos/build.sh
          file webos/build/install/bin/crispy-doom
          "$WEBOS_SDK_ROOT/bin/arm-webos-linux-gnueabi-readelf" -h webos/build/install/bin/crispy-doom | grep -F 'Machine:'
          test -s webos/build/install/bin/crispy-doom

      - name: Upload ARM binary (not yet an installable IPK)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: crispy-doom-webos-arm-experimental
          path: webos/build/install/bin/crispy-doom
          if-no-files-found: error
          retention-days: 7
